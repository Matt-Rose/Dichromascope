<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dichromascope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed viewer. The frame fills the screen; a thin source bar sits on top and a
   dock of four ring dials sits at the bottom. Single dark, strictly achromatic theme so the
   chrome never biases the colours being judged. */
:root {
  --bg: #121212;
  --glass: rgba(18, 18, 18, 0.66);
  --ink: #ededed;
  --muted: #a8a8a8;
  --line: rgba(255, 255, 255, 0.2);
  --track: rgba(255, 255, 255, 0.14);
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font-body); overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--bg); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px);
  background: linear-gradient(var(--glass), rgba(18, 18, 18, 0)); }
.bar h1 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: .01em; }
.bar .sp { flex: 1; }
button, .file { font: 500 12.5px var(--font-body); color: var(--ink); background: var(--glass); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.primary { background: var(--ink); color: var(--bg); }
a.lab { color: var(--muted); font-size: 12.5px; text-decoration: none; border-bottom: 1px solid var(--line); }
#file { position: absolute; width: 1px; height: 1px; opacity: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; display: grid; gap: 6px; justify-items: center;
  padding: 18px calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px);
  background: linear-gradient(rgba(18, 18, 18, 0), var(--glass) 55%); pointer-events: none; }
.dials { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; pointer-events: auto; }
.dial { display: grid; justify-items: center; gap: 2px; width: 78px; cursor: grab; touch-action: none; border-radius: 12px; padding: 2px; }
.dial[aria-disabled="true"] { opacity: .35; }
.dial canvas { width: 72px; height: 72px; display: block; }
.dial .lbl { font-size: 11.5px; color: var(--muted); }
.dial .val { font: 12px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.info { font: 11.5px var(--font-mono); color: var(--muted); text-align: center; max-width: 60ch; pointer-events: auto; text-wrap: balance; }
#note { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(90vw, 44ch); text-align: center;
  background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
.cmp { position: fixed; top: calc(env(safe-area-inset-top) + 52px); left: 50%; transform: translateX(-50%); font: 11.5px var(--font-mono);
  background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<canvas id="stage" aria-label="Transformed view. Press and hold to see the original."></canvas>

<div class="bar">
  <h1>Dichromascope</h1>
  <button id="b-cam" type="button" class="primary">Camera</button>
  <button id="b-flip" type="button" hidden>Flip</button>
  <button id="b-scene" type="button">Toy scene</button>
  <button id="b-chart" type="button">Hue chart</button>
  <label class="file" for="file">Photo or clip…</label>
  <input type="file" id="file" accept="image/*,video/*">
  <span class="sp"></span>
  <button id="b-rate" type="button" title="Animal-to-human JND exchange rate: range-matched, or pinned 1:1 at a given human JND size">Matched</button>
  <button id="b-mode" type="button" aria-pressed="false" title="Show the literal blue–yellow rendering">Natural</button>
  <a class="lab" href="lab.html">Lab</a>
  <a class="lab" href="https://github.com/Matt-Rose/Dichromascope#readme" target="_blank" rel="noopener">About</a>

    disabled: () => S.natural, text: () => S.adapt < 0.05 ? "world" : S.adapt > 0.95 ? "scene" : Math.round(100 * S.adapt) + "%",
    paint(c, r, d) { gauge(c, r, d, S.adapt, Math.round(100 * S.adapt) + "%"); },
  }),
  new Dial("d-hue", {
    min: 0, max: 360, step: 5, sweep: 2 * Math.PI, wrap: true, get: () => S.rot, set: v => { S.rot = v; },
    disabled: () => S.natural, text: () => Math.round(S.rot) + "°",
    paint(c, r, d) {
      const R = r - 9 * d, span = F ? F.span : 300;
      c.lineWidth = 9 * d; c.lineCap = "butt";
      for (let k = 0; k < 120; k++) {
        const h = k * 3, rel = ((h - S.rot) % 360 + 360) % 360;
        c.strokeStyle = rel <= span ? sheetRGB(rel / span, 0.7) : "rgba(255,255,255,0.08)";
        c.beginPath(); c.arc(r, r, R, h * Math.PI / 180 - 0.03, (h + 3) * Math.PI / 180 + 0.01); c.stroke();
      }
      if (M && F) {   // animal neutral point, after von Kries shift
        const y0 = (0 - S.adapt * cMean - M.clo) / (M.chi - M.clo), a = (S.rot + F.span * Math.min(1, Math.max(0, y0))) * Math.PI / 180;
        c.strokeStyle = cssVar("--ink"); c.lineWidth = 2 * d; c.beginPath();
        c.moveTo(r + (R - 8 * d) * Math.cos(a), r + (R - 8 * d) * Math.sin(a)); c.lineTo(r + (R + 5 * d) * Math.cos(a), r + (R + 5 * d) * Math.sin(a)); c.stroke();
      }
      c.fillStyle = cssVar("--ink"); c.font = `500 ${10.5 * d}px IBM Plex Mono, monospace`; c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText(F ? F.span + "°" : "", r, r);
    },
  }),
];
let rebuildPending = false;
function onChange(full) {
  if (rebuildPending) return; rebuildPending = true;
  requestAnimationFrame(() => {
    rebuildPending = false;
    rebuild();
  });
}

// ---------- wiring ----------
document.getElementById("b-cam").addEventListener("click", startCamera);
document.getElementById("b-flip").addEventListener("click", () => { facing = facing === "environment" ? "user" : "environment"; startCamera(); });
document.getElementById("b-scene").addEventListener("click", () => setStill(sceneImage()));
document.getElementById("b-chart").addEventListener("click", () => setStill(swatchImage()));
document.getElementById("b-rate").addEventListener("click", e => {
  S.rate = (S.rate + 1) % RATES.length; e.currentTarget.textContent = RATES[S.rate].label;
  e.currentTarget.setAttribute("aria-pressed", String(S.rate > 0)); rebuild();
});
document.getElementById("b-mode").addEventListener("click", e => {
  S.natural = !S.natural; e.currentTarget.setAttribute("aria-pressed", String(S.natural)); rebuild();
});
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (f.type.startsWith("video/")) {
    stopLive(); note("");
    vid.src = URL.createObjectURL(f);
    vid.onloadeddata = () => { vid.play().then(startLoop).catch(err => note("Couldn't play that clip: " + err.name)); };
  } else {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, Math.sqrt(400000 / (img.width * img.height))), w = Math.round(img.width * s), h = Math.round(img.height * s);
      wx.canvas.width = w; wx.canvas.height = h; wx.drawImage(img, 0, 0, w, h);
      setStill(wx.getImageData(0, 0, w, h)); URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  }
  e.target.value = "";
});
const cmp = document.getElementById("cmp");
stage.addEventListener("pointerdown", e => { comparing = true; cmp.hidden = false; if (srcData) show(); e.preventDefault(); });
const release = () => { if (!comparing) return; comparing = false; cmp.hidden = true; if (srcData) show(); };
stage.addEventListener("pointerup", release); stage.addEventListener("pointercancel", release); stage.addEventListener("pointerleave", release);
stage.addEventListener("contextmenu", e => e.preventDefault());

rebuild();
setStill(sceneImage());
</script>
